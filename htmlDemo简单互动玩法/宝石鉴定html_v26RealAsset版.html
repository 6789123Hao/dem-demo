<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
<link rel="preload" as="image" href="assets/ui_v26/ui_lens_frame/lens_outer_ring_A.png" fetchpriority="high" />
<link rel="preload" as="image" href="assets/ui_v26/ui_lens_frame/lens_inner_glass_A.png" fetchpriority="high" />
<link rel="preload" as="image" href="assets/ui_v26/ui_left_inventory/stone_card_frame_A.png" fetchpriority="high" />
<link rel="preload" as="image" href="assets/ui_v26/ui_left_inventory/stone_card_badge_A.png" fetchpriority="high" />
<link rel="preload" as="image" href="assets/ui_v26/ui_tool_box/tool_box_frame_C.png" fetchpriority="high" />
<link rel="preload" as="image" href="assets/ui_v26/ui_reward_plate/reward_plate_base_C.png" fetchpriority="high" />
<title>宝石鉴定</title>
<style>
    :root{
        --bg:#f4eee3;
        --ink:#2c241b;
        --muted:#786b5c;
        --line:#cab89f;
        --wood:#8d5d36;
        --wood-dark:#56341f;
        --gold:#d29b45;
        --green:#dceedd;
        --blue:#e8edf6;
        --danger:#f3d7d1;
        --shadow:0 18px 48px rgba(68,43,25,.18);
    }
    *{ box-sizing:border-box; }
    body{
        margin:0;
        min-height:100dvh;
        overflow-x:hidden;
        font-family:"Microsoft YaHei", system-ui, sans-serif;
        color:var(--ink);
        background:
            radial-gradient(circle at 18% 12%, rgba(210,155,69,.18), transparent 34%),
            linear-gradient(135deg, #fff9ef 0%, var(--bg) 58%, #eadcc9 100%);
    }
    button{ font:inherit; }
    .screen{ display:none; min-height:100dvh; padding:24px; }
    .screen.active{ display:block; }
    #screen-main{ position:relative; }
    .topbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:18px;
        margin-bottom:18px;
    }
    .top-actions{
        display:flex;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
        justify-content:flex-end;
    }
    .gm-actions{
        display:flex;
        align-items:center;
        gap:8px;
        padding:8px;
        border:1px dashed rgba(119,78,38,.45);
        border-radius:10px;
        background:rgba(71,48,30,.1);
        position:relative;
    }
    .gm-actions::before{
        content:"GM测试区｜非玩法";
        position:absolute;
        left:10px;
        top:-11px;
        padding:0 6px;
        border-radius:999px;
        background:#4a301f;
        color:#ffe3a3;
        font-size:11px;
        font-weight:900;
        letter-spacing:0;
    }
    .demo-actions{
        display:flex;
        align-items:center;
        gap:10px;
        margin-left:auto;
    }
    .title h1{ margin:0 0 6px; font-size:30px; letter-spacing:0; }
    .title p{ margin:0; color:var(--muted); }
    .btn{
        border:1px solid rgba(86,52,31,.22);
        background:#fff9ee;
        color:var(--ink);
        border-radius:8px;
        padding:10px 14px;
        cursor:pointer;
        box-shadow:0 6px 16px rgba(68,43,25,.08);
    }
    .btn.primary{ background:linear-gradient(180deg, #f3c36d, #d99d3c); border-color:#af742c; color:#2b1c0f; font-weight:700; }
    .btn.ghost{ background:rgba(255,255,255,.55); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .data-pack-select{
        min-height:42px;
        min-width:180px;
        border:1px solid rgba(86,52,31,.22);
        border-radius:8px;
        background:#fff9ee;
        color:var(--ink);
        padding:0 12px;
        box-shadow:0 6px 16px rgba(68,43,25,.08);
    }
    .layout-select{
        min-height:42px;
        min-width:136px;
        border:1px solid rgba(86,52,31,.22);
        border-radius:8px;
        background:#fff9ee;
        color:var(--ink);
        padding:0 12px;
        box-shadow:0 6px 16px rgba(68,43,25,.08);
    }
    .gm-btn{
        display:inline-flex;
        border-style:dashed;
    }
    .entry-drag-cue{
        position:absolute;
        left:348px;
        top:205px;
        width:132px;
        height:430px;
        z-index:8;
        pointer-events:none;
    }
    body.playing .entry-drag-cue{ display:none; }
    .drag-link-arrow{
        position:absolute;
        left:0;
        width:132px;
        height:54px;
        overflow:visible;
        filter:drop-shadow(0 9px 14px rgba(83,50,28,.14));
        opacity:0;
        animation:dragArrowPulse 2.1s ease-in-out infinite;
    }
    .drag-link-arrow-bag{
        display:none;
    }
    .drag-link-arrow-list{
        left:-8px;
        top:190px;
        --arrow-base:rotate(135deg) scale(1.18);
        --arrow-base-active:rotate(135deg) scale(1.32);
        animation-delay:.18s;
    }
    .drag-arrow-pad{
        fill:rgba(255,252,244,.22);
        stroke:rgba(255,248,226,.58);
        stroke-width:2;
    }
    .drag-arrow-shadow{
        fill:none;
        stroke:rgba(78,48,28,.18);
        stroke-width:16;
        stroke-linecap:round;
        stroke-linejoin:round;
    }
    .drag-arrow-line{
        fill:none;
        stroke:rgba(255,248,226,.98);
        stroke-width:10;
        stroke-linecap:round;
        stroke-linejoin:round;
    }
    .drag-arrow-glint{
        fill:none;
        stroke:rgba(255,255,255,.72);
        stroke-width:3;
        stroke-linecap:round;
        stroke-linejoin:round;
    }
    @keyframes dragArrowPulse{
        0%,100%{ opacity:0; transform:translateX(-10px) var(--arrow-base, scale(.96)); }
        34%,68%{ opacity:1; transform:translateX(0) var(--arrow-base-active, scale(1)); }
    }
    .pill{
        display:inline-flex;
        align-items:center;
        gap:6px;
        border:1px solid rgba(86,52,31,.18);
        background:rgba(255,255,255,.58);
        border-radius:999px;
        padding:6px 10px;
        color:var(--muted);
        font-size:13px;
    }
    .main-grid{
        display:grid;
        grid-template-columns:280px 1fr 320px;
        gap:18px;
        align-items:stretch;
    }
    .panel{
        background:rgba(255,252,246,.86);
        border:1px solid var(--line);
        border-radius:8px;
        box-shadow:var(--shadow);
        padding:16px;
    }
    .panel h2,.panel h3{ margin:0 0 12px; font-size:18px; }
    .bag{
        position:relative;
        width:min(330px, 88%);
        aspect-ratio:1 / .92;
        margin:26px auto 20px;
        border:3px solid var(--wood-dark);
        border-radius:36px 36px 18px 18px;
        background:
            radial-gradient(circle at 50% 18%, rgba(255,255,255,.26), transparent 34%),
            linear-gradient(135deg, #b9854b, #6e4226);
        cursor:grab;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#fff8e8;
        text-align:center;
        box-shadow:0 20px 36px rgba(83,50,28,.26);
        user-select:none;
    }
    .bag:active{ cursor:grabbing; }
    .bag::before{
        content:"";
        position:absolute;
        inset:18px 28px auto;
        height:24px;
        border-radius:999px;
        background:#382114;
        box-shadow:inset 0 3px 0 rgba(255,255,255,.12);
    }
    .bag-count{ font-size:48px; font-weight:800; line-height:1; }
    .bag-label{ margin-top:8px; font-size:15px; color:#ffe8bf; }
    .drop-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:16px;
        margin-top:18px;
    }
    .drop-zone{
        min-height:174px;
        border:2px dashed rgba(86,52,31,.35);
        border-radius:8px;
        background:rgba(255,255,255,.42);
        padding:16px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        transition:.16s ease;
    }
    .drop-zone.over{ border-color:#b9792d; background:#fff4dc; transform:translateY(-2px); }
    .lens-icon{
        width:86px;
        height:86px;
        border:8px solid #5a4633;
        border-radius:50%;
        background:radial-gradient(circle at 35% 30%, #ffffff, #a7ddff 58%, #5588ab 100%);
        margin-bottom:10px;
    }
    .batch-icon{
        width:92px;
        height:70px;
        border:3px solid #5a4633;
        border-radius:8px;
        background:linear-gradient(135deg, #e8edf6, #fdfbf5);
        margin-bottom:10px;
        position:relative;
    }
    .batch-icon::after{
        content:"";
        position:absolute;
        width:46px;
        height:20px;
        border-radius:50%;
        background:#d29b45;
        left:22px;
        bottom:14px;
        box-shadow:18px -6px 0 #87c7b6, -14px -4px 0 #b66a5c;
    }
    .stone-list{
        display:grid;
        gap:8px;
        max-height:none;
        overflow:auto;
        padding-right:4px;
        flex:1;
        min-height:0;
        align-content:start;
    }
    .stone-card{
        border:1px solid rgba(86,52,31,.18);
        background:#fffaf1;
        border-radius:8px;
        padding:10px;
        display:grid;
        grid-template-columns:34px 1fr auto;
        gap:10px;
        align-items:center;
        cursor:grab;
    }
    .stone-card:not(.empty):not(.locked){
        cursor:pointer;
    }
    .stone-card.locked{ opacity:.48; cursor:not-allowed; }
    .stone-card.empty .pill{
        opacity:.42;
        filter:grayscale(1);
    }
    .stone-dot{
        width:34px;
        height:34px;
        border-radius:50%;
        border:2px solid rgba(35,25,16,.22);
        background-size:contain !important;
        background-repeat:no-repeat !important;
        background-position:center !important;
        box-shadow:0 5px 10px rgba(54,36,20,.14);
    }
    .stone-dot.with-image{
        border-color:transparent;
        filter:drop-shadow(0 5px 7px rgba(54,36,20,.18));
    }
    .stone-name{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:6px;
        font-weight:700;
    }
    .stone-title{
        display:flex;
        align-items:center;
        gap:6px;
        min-width:0;
    }
    .stone-title > span:first-child{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .stone-rarity{
        color:#b8761d;
        font-size:12px;
        font-weight:900;
        letter-spacing:0;
        white-space:nowrap;
    }
    .stone-count{
        padding:2px 7px;
        border-radius:999px;
        background:rgba(169,108,39,.12);
        color:#7c4d1d;
        font-size:12px;
        font-weight:900;
        white-space:nowrap;
    }
    .stone-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
    .star-rank{ color:#c48a2f; font-weight:900; letter-spacing:1px; }
    .inventory-note{ color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 12px; }
    .sort-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin:0 0 10px;
    }
    .sort-btn{
        border:1px solid rgba(86,52,31,.18);
        border-radius:8px;
        background:#fffaf1;
        color:var(--ink);
        min-height:34px;
        cursor:pointer;
        font-weight:700;
    }
    .sort-btn.active{
        border-color:#a96c27;
        background:#ffe8bf;
        box-shadow:inset 0 0 0 1px rgba(169,108,39,.18);
    }
    .plate{
        min-height:180px;
        border:2px solid rgba(86,52,31,.22);
        border-radius:50%;
        background:radial-gradient(circle, #fffdf6 0%, #e2d7c8 70%, #bca98f 100%);
        display:flex;
        align-items:center;
        justify-content:center;
        flex-wrap:wrap;
        gap:8px;
        padding:22px;
        margin-top:10px;
    }
    .plate-actions{
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        margin-top:8px;
    }
    .organize-plate-btn{
        min-height:34px;
        font-size:13px;
    }
    .plate-gem{
        min-width:74px;
        border:1px solid rgba(86,52,31,.2);
        background:rgba(255,255,255,.72);
        border-radius:8px;
        padding:7px 9px;
        font-size:13px;
        text-align:center;
    }
    .log{
        margin-top:8px;
        min-height:0;
        max-height:58px;
        overflow:hidden;
        padding:10px;
        border-radius:8px;
        border:1px solid rgba(86,52,31,.16);
        background:rgba(255,255,255,.44);
        color:var(--muted);
        font-size:13px;
        line-height:1.55;
        cursor:pointer;
        transition:max-height .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .log > div{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .log > div:nth-child(n+3){ display:none; }
    .log.expanded{
        max-height:210px;
        overflow:auto;
        background:rgba(255,255,255,.82);
        box-shadow:0 14px 28px rgba(68,43,25,.12);
    }
    .log.expanded > div{
        white-space:normal;
    }
    .log.expanded > div:nth-child(n+3){ display:block; }
    .log:empty::before{
        content:"...";
        color:rgba(86,52,31,.38);
    }
    .top-log{
        position:relative;
        z-index:30;
        max-width:980px;
        min-height:38px;
        max-height:38px;
        margin:10px auto 0;
        border-radius:10px;
        background:rgba(255,252,246,.86);
        box-shadow:0 8px 22px rgba(68,43,25,.08);
    }
    .top-log.expanded{
        max-height:180px;
    }
    .play-grid{
        display:grid;
        grid-template-columns:1fr 300px;
        gap:18px;
        min-height:calc(100vh - 116px);
    }
    .playfield{
        position:relative;
        overflow:hidden;
        border:1px solid var(--line);
        border-radius:8px;
        background:
            linear-gradient(180deg, rgba(255,255,255,.72), rgba(237,225,207,.88)),
            repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(95,64,36,.04) 29px);
        box-shadow:var(--shadow);
    }
    .lens-stage{
        position:absolute;
        inset:38px 44px 72px;
        border:12px solid #5b4633;
        border-radius:50%;
        background:radial-gradient(circle at center, rgba(255,255,255,.72), rgba(125,196,226,.2) 62%, rgba(45,65,74,.12));
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
    }
    .lens-stage::before{
        content:"";
        position:absolute;
        inset:0;
        background:var(--lens-filter, rgba(127,223,255,.28));
        mix-blend-mode:multiply;
        pointer-events:none;
    }
    .gem3d{
        width:230px;
        height:230px;
        position:relative;
        transform:translate(-50%, -50%);
        transform-style:flat;
        transition:transform .52s ease, filter .2s ease;
        filter:drop-shadow(0 26px 24px rgba(52,35,21,.22));
    }
    .gem-core{
        position:absolute;
        inset:18px;
        clip-path:polygon(50% 0, 88% 18%, 100% 56%, 66% 100%, 28% 94%, 0 55%, 12% 18%);
        background:var(--gem-color);
        border:2px solid rgba(255,255,255,.42);
    }
    .gem-core::before{
        content:"";
        position:absolute;
        inset:0;
        background:
            linear-gradient(40deg, transparent 0 28%, rgba(255,255,255,.38) 29% 31%, transparent 32%),
            linear-gradient(120deg, transparent 0 44%, rgba(0,0,0,.18) 45% 48%, transparent 49%),
            radial-gradient(circle at 35% 28%, rgba(255,255,255,.55), transparent 24%);
    }
    .hotspot{
        position:absolute;
        width:42px;
        height:42px;
        border-radius:50%;
        border:3px solid rgba(255,255,255,.92);
        background:rgba(210,155,69,.82);
        box-shadow:0 0 0 8px rgba(210,155,69,.18), 0 10px 24px rgba(0,0,0,.2);
        transform:translate(-50%, -50%);
        cursor:pointer;
        z-index:4;
        display:grid;
        place-items:center;
        color:#fffaf1;
        font-size:12px;
        font-weight:800;
        line-height:1;
        touch-action:none;
    }
    .hotspot.done{ opacity:0; pointer-events:none; }
    .hotspot.hotspot-reveal{
        animation:defectRevealPulse .32s ease-out both;
    }
    @keyframes defectRevealPulse{
        0%{ filter:brightness(1.75) drop-shadow(0 0 0 rgba(255,244,180,0)); opacity:.9; }
        46%{ filter:brightness(1.42) drop-shadow(0 0 24px rgba(255,232,128,.82)); opacity:1; }
        100%{ filter:brightness(1) drop-shadow(0 0 0 rgba(255,244,180,0)); opacity:1; }
    }
    .hotspot-clean{
        width:330px;
        height:330px;
        border-color:transparent;
        background:transparent;
        box-shadow:none;
        color:transparent;
    }
    .hotspot-clean::before{
        content:"";
        position:absolute;
        left:50%;
        top:50%;
        width:252px;
        height:252px;
        transform:translate(-50%, -50%);
        border-radius:50%;
        border:0;
        opacity:0;
        background:none;
        box-shadow:none;
        overflow:hidden;
    }
    .hotspot-clean::after{
        content:"\2190\64E6\2192";
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        color:#fffaf1;
        font-size:15px;
        font-weight:800;
        letter-spacing:.08em;
        text-shadow:0 2px 8px rgba(48,39,32,.28);
    }
    .hotspot-repair{
        width:52px;
        height:52px;
        border-radius:50%;
        border:2px solid rgba(255,250,224,.96);
        background:
            radial-gradient(circle, rgba(255,248,205,.16) 0 38%, transparent 39%),
            radial-gradient(circle, rgba(41,158,148,.18), transparent 68%);
        transform:translate(calc(-50% + var(--repair-hotspot-x, 0px)), calc(-50% + var(--repair-hotspot-y, 0px)));
        transform-origin:center;
        box-shadow:
            0 0 0 9px rgba(47,177,151,.12),
            0 0 22px rgba(255,222,129,.34),
            inset 0 0 0 2px rgba(51,38,18,.18);
        color:transparent;
        font-size:0;
        transition:transform .16s ease, opacity .16s ease, box-shadow .16s ease;
    }
    .hotspot-repair::before,
    .hotspot-repair::after{
        content:"";
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        pointer-events:none;
    }
    .hotspot-repair::before{
        width:66px;
        height:66px;
        border-radius:50%;
        border:1px solid rgba(255,248,226,.48);
        animation:repairTargetPulse 1.28s ease-in-out infinite;
    }
    .hotspot-repair::after{
        width:24px;
        height:24px;
        border-radius:50%;
        border:1px solid rgba(255,248,226,.74);
        box-shadow:inset 0 0 10px rgba(57,198,176,.22);
    }
    @keyframes repairTargetPulse{
        0%,100%{ opacity:.36; transform:translate(-50%, -50%) scale(.86); }
        50%{ opacity:1; transform:translate(-50%, -50%) scale(1.08); }
    }
    .hotspot-cut{
        width:320px;
        height:92px;
        border-radius:999px;
        border-color:transparent;
        background:transparent;
        transform:translate(-50%, -50%) rotate(var(--cut-angle, -22deg));
        box-shadow:none;
        color:transparent;
        white-space:pre;
    }
    .hotspot-cut::before{
        content:"";
        position:absolute;
        left:50%;
        top:50%;
        width:210px;
        height:34px;
        border-radius:999px;
        transform:translate(-50%, -50%);
        background:rgba(105,108,104,.82);
        border:3px solid rgba(255,255,255,.86);
        box-shadow:0 0 0 8px rgba(92,94,90,.16), inset 0 4px 8px rgba(255,255,255,.2);
    }
    .hotspot-cut::after{
        content:"  滑→→→       ";
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        color:#fffaf1;
        font-size:13px;
        font-weight:800;
        white-space:pre;
    }
    .hotspot-light{
        width:388px;
        height:388px;
        border:0;
        background:transparent;
        box-shadow:none;
        color:transparent;
        cursor:grab;
    }
    .hotspot-light:active{ cursor:grabbing; }
    .hotspot-light::before{
        content:"";
        position:absolute;
        left:50%;
        top:50%;
        width:332px;
        height:332px;
        transform:translate(-50%, -50%);
        border-radius:50%;
        background:
            radial-gradient(circle at 50% 50%, rgba(255,252,223,.38) 0 14%, rgba(255,232,144,.18) 32%, transparent 68%),
            conic-gradient(from 22deg, transparent 0 12%, rgba(255,246,200,.34) 16% 23%, transparent 30% 58%, rgba(98,224,218,.16) 62% 68%, transparent 76% 100%);
        box-shadow:inset 0 0 42px rgba(255,255,255,.16), 0 0 0 18px rgba(210,155,69,.08);
        opacity:.78;
        animation:lightSearchSweep 2.4s ease-in-out infinite;
        pointer-events:none;
    }
    .hotspot-light::after{
        content:"寻光";
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        color:rgba(255,250,226,.86);
        font-size:14px;
        font-weight:800;
        letter-spacing:.12em;
        text-shadow:0 2px 10px rgba(70,46,23,.28), 0 0 14px rgba(255,232,140,.42);
        pointer-events:none;
    }
    @keyframes lightSearchSweep{
        0%{ transform:translate(-50%, -50%) rotate(-10deg) scale(.96); opacity:.52; }
        48%{ transform:translate(-50%, -50%) rotate(16deg) scale(1.04); opacity:.84; }
        100%{ transform:translate(-50%, -50%) rotate(-10deg) scale(.96); opacity:.52; }

        .sort((a,b)=>{

            const ub = isUnseen(b) ? 0 : 1;
            if(ua !== ub) return ua - ub;
            return GEM_BLUEPRINTS.findIndex(g=>g.id===a) - GEM_BLUEPRINTS.findIndex(g=>g.id===b);

function sortedListGems(){

        if(state.listSortKey === "rarity"){
            if(b.rarity !== a.rarity) return state.raritySortDir * (a.rarity - b.rarity);
            if(countInBag(b.id) !== countInBag(a.id)) return countInBag(b.id) - countInBag(a.id);
        } else {
            if(countInBag(b.id) !== countInBag(a.id)) return countInBag(b.id) - countInBag(a.id);
            if(b.rarity !== a.rarity) return b.rarity - a.rarity;
        }
        return GEM_BLUEPRINTS.findIndex(g=>g.id===a.id) - GEM_BLUEPRINTS.findIndex(g=>g.id===b.id);

}

function plateItemsForRender(){
    if(state.plateItems?.length) return state.plateItems;
    const items = [];
    Object.keys(state.plate).forEach(id=>{
        for(let i = 0; i < state.plate[id]; i++) items.push(createPlateItem(id, items));
    });
    state.plateItems = items;
    return items;
}
function createPlateItem(id, existingItems = state.plateItems || []){
    const pos = randomPlatePosition(existingItems);
    return {
        id,
        x:pos.x,
        y:pos.y,
        dropRot:Math.random() * 220 - 110,
        restRot:Math.random() * 26 - 13
    };
}
function randomPlatePosition(existingItems = []){
    const attempts = existingItems.length > 34 ? 12 : 42;
    const safeRadius = 31;
    let best = null;
    let bestScore = -Infinity;
    for(let i = 0; i < attempts; i++){
        const radius = Math.sqrt(Math.random()) * safeRadius;
        const angle = Math.random() * Math.PI * 2;
        const point = {
            x:50 + Math.cos(angle) * radius,
            y:50 + Math.sin(angle) * radius
        };
        const nearest = existingItems.length
            ? Math.min(...existingItems.map(item=>Math.hypot(point.x - (item.x ?? 50), point.y - (item.y ?? 50))))
            : safeRadius;
        const edgeComfort = safeRadius - Math.hypot(point.x - 50, point.y - 50);
        const score = nearest + edgeComfort * .08;
        if(score > bestScore){
            best = point;
            bestScore = score;
        }
    }
    return best || { x:50, y:50 };
}
function circularPlatePositions(count){
    if(count <= 1) return [{ x:50, y:50 }];
    const positions = [];
    const safeRadius = 31;
    let rings = 1;
    while(1 + rings * 6 + Math.max(0, rings - 1) * 6 < count && rings < 5) rings += 1;
    const rowGap = (safeRadius * 2) / Math.max(4, rings * 2 + 2);
    for(let row = -rings; row <= rings; row++){
        const y = 50 + row * rowGap;
        const xSpan = Math.sqrt(Math.max(0, safeRadius * safeRadius - (y - 50) * (y - 50)));
        const cells = Math.max(1, Math.floor((xSpan * 2) / rowGap));
        for(let col = 0; col < cells; col++){
            const x = cells === 1 ? 50 : 50 - xSpan + (xSpan * 2) * (col / (cells - 1));
            positions.push({ x, y });
        }
    }
    positions.sort((a,b)=>a.y - b.y || a.x - b.x);
    return positions.slice(0, count);
}
function addPlateItems(id, amount){
    if(!state.plateItems) state.plateItems = [];
    for(let i = 0; i < amount; i++){
        const insertAt = Math.floor(Math.random() * (state.plateItems.length + 1));
        state.plateItems.splice(insertAt, 0, createPlateItem(id, state.plateItems));
    }
}
function organizePlate(){
    if(!state.plateItems?.length){
        toast("盘子里还没有成石");
        return;
    }
    state.plateItems.sort((a,b)=>{
        const orderA = GEM_BLUEPRINTS.findIndex(g=>g.id === a.id);
        const orderB = GEM_BLUEPRINTS.findIndex(g=>g.id === b.id);
        return orderA - orderB;
    });
    circularPlatePositions(state.plateItems.length).forEach((pos, index)=>{
        state.plateItems[index].x = pos.x;
        state.plateItems[index].y = pos.y;
    });
    addLog("盘子里的成石已整理排序。");
    renderPlate();
}
function rewardShapeForGem(gem){
    const shapeTask = gem.tasks.find(task=>task.type === "shape");
    if(shapeTask?.targetShape === "triangle") return "triangle";
    if(shapeTask?.targetShape === "square") return "square";
    return "circle";
}
function plateGemImageValue(gem, shape){
    const base = V24_ENTITY_ASSETS[gem.id];
    if(!base) return "";
    const shapedName = shape === "circle" ? "cleaned_circle" : shape === "triangle" ? "cleaned_triangle" : "cleaned_square";
    const fallback = gem.tasks.some(task=>task.type === "shape") ? shapedName : "cleaned";
    return `url("${base}/${fallback}.png?${V24_ASSET_VERSION}")`;
}
function firstUnseenOrFirstBagId(){
    const sorted = sortedBagIds();
    return sorted[0] || null;

function releaseTypeToPlate(id, reason){
    const amount = countInBag(id);
    if(amount <= 0) return 0;
    state.bag[id] = 0;
    state.plate[id] = (state.plate[id] || 0) + amount;
    addPlateItems(id, amount);
    const gem = gemById(id);
    state.rewards.push({ id, amount, shards:gem.rewardShards * amount, reason });
    state.knownTypes.add(id);
    return amount;
}
function releaseKnownTypesForBatch(){
    let released = 0;
    sortedBagIds().forEach(id=>{
        if(state.knownTypes.has(id)){
            const gem = gemById(id);
            const amount = releaseTypeToPlate(id, "整袋批量入口自动完成已知类型");
            if(amount > 0){
                state.playedTypes.add(id);
                released += amount;
                addLog(`${gem.name} 已知类型自动完成，同类型 ${amount} 颗出石到盘子。`);
            }
        }
    });
    if(released) addLog(`批量入口依次自动完成 ${released} 颗可处理素体。`);
    return released;
}

function startBatchFromBag(){

const PRELOADED_IMAGE_URLS = new Set();
const PRELOADING_IMAGES = new Set();
function preloadImageAsset(src, priority="auto"){
    if(!src || PRELOADED_IMAGE_URLS.has(src)) return Promise.resolve(src);
    PRELOADED_IMAGE_URLS.add(src);
    return new Promise(resolve=>{
        const img = new Image();
        PRELOADING_IMAGES.add(img);
        img.decoding = "async";
        if("fetchPriority" in img) img.fetchPriority = priority;
        img.onload = img.onerror = ()=>{

            resolve(src);
        };
        img.src = src;
    });
}
function preloadImageBatch(urls, { priority="auto", concurrency=6 } = {}){
    const queue = [...new Set(urls.filter(Boolean))];
    let cursor = 0;
    let active = 0;
    return new Promise(resolve=>{
        const pump = ()=>{
            while(active < concurrency && cursor < queue.length){
                active++;
                preloadImageAsset(queue[cursor++], priority).then(()=>{
                    active--;
                    pump();
                });
            }
            if(cursor >= queue.length && active === 0) resolve();
        };
        pump();
    });
}
function idlePreloadImageBatch(urls, { priority="low", batchSize=4, timeout=1800 } = {}){
    const queue = [...new Set(urls.filter(Boolean).filter(src=>!PRELOADED_IMAGE_URLS.has(src)))];
    if(!queue.length) return;
    const runBatch = deadline=>{
        let count = 0;
        while(queue.length && count < batchSize && (!deadline || deadline.timeRemaining() > 8)){
            preloadImageAsset(queue.shift(), priority);
            count++;
        }
        if(queue.length) schedule();
    };
    const schedule = ()=>{
        if("requestIdleCallback" in window) window.requestIdleCallback(runBatch, { timeout });
        else setTimeout(()=>runBatch(null), 120);
    };
    schedule();
}

    if(hasCut) stages.add("raw");
    if(hasRepair){

function handleHotspotClick(){

        const targetIndex = Math.min(step.repairTargetIndex || 0, REPAIR_TARGETS.length - 1);
        step.clicks = (step.clicks || 0) + 1;
        step.repairFill = Math.min(1, (step.repairFill || 0) + REPAIR_FILL_PER_CLICK);
        step.repairTargetIndex = Math.min(REPAIR_TARGETS.length - 1, targetIndex + 1);
        const complete = step.repairFill >= REPAIR_COMPLETE_THRESHOLD;

        playRepairDrop(targetIndex);

function startDefectDrag(e){
    const step = currentStep();
    if(!step || !["clean","cut","shape","light"].includes(step.type)) return;
    if(!canUseCurrentStep(step)) return;
    e.preventDefault();
    e.currentTarget.setPointerCapture?.(e.pointerId);
    const shapeTrace = step.type === "shape" ? beginShapeTrace(e.clientX, e.clientY) : null;
    const now = performance.now();
    state.defectDrag = {
        type:step.type,
        pointerId:e.pointerId,
        startX:e.clientX,
        startY:e.clientY,
        lastX:e.clientX,
        lastY:e.clientY,
        lastTime:now,
        velocityX:0,
        cleanBrushLean:0,
        baseDistance:step.type === "clean" ? (step.dragDistance || 0) : 0,
        lightBaseHold:step.type === "light" ? (step.lightHold || 0) : 0,
        distance:0,
        lastParticleDistance:0,
        points:[{ x:e.clientX, y:e.clientY }],
        shapeTrace
    };
    if(step.type === "clean"){
        addCleanErasePoint(step, e.clientX, e.clientY);
        renderPlay();
        renderCleanToolFx(e.clientX, e.clientY, 0);
    }
    if(step.type === "shape") renderShapeToolFx(e.clientX, e.clientY);
    if(step.type === "light"){
        updateLightSearch(step, e.clientX, e.clientY, 0);
        renderLightToolFx(e.clientX, e.clientY, step.lightSignal || 0, step);
        renderCurrentTool();
    }
    spawnDragParticle(e.clientX, e.clientY, step.type);
}
function updateDefectDrag(e){
    const drag = state.defectDrag;
    const step = currentStep();
    if(!drag || !step || drag.pointerId !== e.pointerId) return;
    const now = performance.now();
    const dt = Math.max(16, now - (drag.lastTime || now));
    const dx = e.clientX - drag.lastX;
    const dy = e.clientY - drag.lastY;
    drag.distance += Math.hypot(dx, dy);
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;
    drag.lastTime = now;
    drag.points.push({ x:e.clientX, y:e.clientY });
    if(step.type === "shape") updateShapeTrace(drag.shapeTrace, e.clientX, e.clientY);
    if(step.type === "clean"){
        const velocityX = dx / dt;
        const accelerationX = (velocityX - (drag.velocityX || 0)) / dt;
        const leanTarget = clampNumber(velocityX * 10 + accelerationX * 180, -18, 18);
        drag.cleanBrushLean = (drag.cleanBrushLean || 0) * .58 + leanTarget * .42;
        drag.velocityX = velocityX;
        addCleanErasePoint(step, e.clientX, e.clientY);
        renderCleanToolFx(e.clientX, e.clientY, drag.cleanBrushLean);
    }
    if(step.type === "light"){
        updateLightSearch(step, e.clientX, e.clientY, dt);
        renderLightToolFx(e.clientX, e.clientY, step.lightSignal || 0, step);
        renderCurrentTool();
        if((step.lightHold || 0) >= LIGHT_SEARCH_REQUIRED_MS){
            state.suppressNextClick = true;
            state.defectDrag = null;
            clearLightToolFx();
            completeCurrentStep(step);
            return;
        }
    }
    if(step.type === "shape") renderShapeToolFx(e.clientX, e.clientY);
    if(drag.distance - drag.lastParticleDistance >= 18){
        spawnDragParticle(e.clientX, e.clientY, step.type);
        drag.lastParticleDistance = drag.distance;
    }
    if(step.type === "clean"){
        step.dragDistance = Math.min(CLEAN_DISTANCE_REQUIRED, (drag.baseDistance || 0) + drag.distance);
        renderPlay();
        if(step.dragDistance >= CLEAN_DISTANCE_REQUIRED){
            state.suppressNextClick = true;
            state.defectDrag = null;
            clearCleanToolFx();
            completeCurrentStep(step);
        }
    }
}

function cleanErasePointFromPointer(clientX, clientY){
    const gem = document.getElementById("gem3d");
    const rect = gem?.getBoundingClientRect();
    if(!rect || !rect.width || !rect.height) return { x:50, y:50 };
    return {
        x:clampNumber((clientX - rect.left) / rect.width * 100, 2, 98),
        y:clampNumber((clientY - rect.top) / rect.height * 100, 2, 98)
    };
}
function addCleanErasePoint(step, clientX, clientY){
    if(!step || step.type !== "clean") return;
    const point = cleanErasePointFromPointer(clientX, clientY);
    const points = step.cleanErasePoints || (step.cleanErasePoints = []);
    const last = points[points.length - 1];
    if(!last || Math.hypot(point.x - last.x, point.y - last.y) >= 1.15){
        points.push(point);
        if(points.length > 190) points.splice(0, points.length - 190);
    }
}
function gemPointToStagePoint(point){
    const gem = document.getElementById("gem3d");
    const stage = document.getElementById("lens-stage");
    const gemRect = gem?.getBoundingClientRect();
    const stageRect = stage?.getBoundingClientRect();
    if(!gemRect || !stageRect || !gemRect.width || !gemRect.height) return { x:0, y:0 };
    return {
        x:gemRect.left - stageRect.left + gemRect.width * clampNumber(point.x, 0, 100) / 100,
        y:gemRect.top - stageRect.top + gemRect.height * clampNumber(point.y, 0, 100) / 100

}
function updateLightSearch(step, clientX, clientY, dt){
    if(!step || step.type !== "light") return;
    const point = cleanErasePointFromPointer(clientX, clientY);
    const target = step.lightTarget || { x:50, y:50 };
    const distance = Math.hypot(point.x - target.x, point.y - target.y);
    const signal = clampNumber(1 - distance / LIGHT_SIGNAL_RADIUS, 0, 1);
    const previousSignal = step.lightSignal || 0;
    step.lightSignal = Math.max(signal, previousSignal * .76);
    if(distance <= LIGHT_HIT_RADIUS){
        step.lightHold = Math.min(LIGHT_SEARCH_REQUIRED_MS, (step.lightHold || 0) + Math.max(0, dt));
    } else {
        step.lightHold = Math.max(0, (step.lightHold || 0) - Math.max(0, dt) * .28);
    }
}

function clearShapeToolFx(){
    document.querySelectorAll(".shape-tool-fx").forEach(el=>el.remove());
}
function renderLightToolFx(clientX, clientY, signal=0, step=currentStep()){
    const stage = document.getElementById("lens-stage");
    if(!stage) return;
    let fx = stage.querySelector(".light-tool-fx");
    if(!fx){
        fx = document.createElement("div");
        fx.className = "light-tool-fx";
        fx.innerHTML = `<span class="light-tool-spot"></span><span class="light-tool-beam"></span><span class="light-tool-lamp"></span><span class="light-signal-star"></span>`;
        stage.appendChild(fx);
    }
    const rect = stage.getBoundingClientRect();
    const x = Math.max(70, Math.min(rect.width - 70, clientX - rect.left));
    const y = Math.max(88, Math.min(rect.height - 58, clientY - rect.top));
    const sourceX = Math.min(rect.width - 30, x + 86);
    const sourceY = Math.max(42, y - 112);
    const target = gemPointToStagePoint(step?.lightTarget || { x:50, y:50 });
    const visibleSignal = clampNumber(signal, 0, 1);
    fx.style.setProperty("--light-tool-x", `${x}px`);
    fx.style.setProperty("--light-tool-y", `${y}px`);
    fx.style.setProperty("--light-source-x", `${sourceX}px`);
    fx.style.setProperty("--light-source-y", `${sourceY}px`);
    fx.style.setProperty("--light-star-x", `${target.x}px`);
    fx.style.setProperty("--light-star-y", `${target.y}px`);
    fx.style.setProperty("--light-signal", visibleSignal.toFixed(3));
    fx.style.setProperty("--light-star-scale", (.42 + visibleSignal * .76).toFixed(3));
}
function clearLightToolFx(){
    document.querySelectorAll(".light-tool-fx").forEach(el=>el.remove());
}
function playLightFoundFx(step){
    const stage = document.getElementById("lens-stage");
    if(!stage || !step) return;
    const point = gemPointToStagePoint(step.lightTarget || { x:50, y:50 });
    const burst = document.createElement("span");
    burst.className = "light-found-burst";
    burst.style.setProperty("--light-star-x", `${point.x}px`);
    burst.style.setProperty("--light-star-y", `${point.y}px`);
    stage.appendChild(burst);
    setTimeout(()=>burst.remove(), 720);
}
function spawnCompletionFragments(type){
    const spot = document.getElementById("hotspot");
    const rect = spot?.getBoundingClientRect();
    const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    const count = type === "cut" ? 28 : 14;
    for(let i = 0; i < count; i++){
        const side = i % 2 === 0 ? -1 : 1;
        const cutDx = side * (74 + Math.random() * 190);
        const cutDy = 94 + Math.random() * 150;
        const fragment = document.createElement("span");
        fragment.className = `finish-fragment finish-fragment-${type}`;
        fragment.style.left = `${originX + (Math.random() - .5) * 96}px`;
        fragment.style.top = `${originY + (Math.random() - .5) * 42}px`;
        fragment.style.setProperty("--frag-dx", `${type === "cut" ? cutDx : (Math.random() - .5) * 120}px`);
        fragment.style.setProperty("--frag-dy", `${type === "cut" ? cutDy : 70 + Math.random() * 90}px`);
        fragment.style.setProperty("--frag-rot", `${Math.random() * 220 - 110}deg`);
        document.body.appendChild(fragment);
        setTimeout(()=>fragment.remove(), 980);
    }
}
function playCutSwipeFx(step, drag, endX, endY){
    const stage = document.getElementById("lens-stage");
    if(!stage || !drag) return;
    stage.querySelectorAll(".cut-slash-fx").forEach(el=>el.remove());
    const rect = stage.getBoundingClientRect();
    const startX = drag.startX - rect.left;
    const startY = drag.startY - rect.top;
    const finishX = endX - rect.left;
    const finishY = endY - rect.top;
    const dx = finishX - startX;
    const dy = finishY - startY;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const fallback = defectStagePosition(step);
    const centerX = Number.isFinite(finishX)
        ? (startX + finishX) / 2
        : rect.width * fallback.x / 100;
    const centerY = Number.isFinite(finishY)
        ? (startY + finishY) / 2
        : rect.height * fallback.y / 100;
    const length = Math.max(178, Math.min(distance * 1.08, Math.min(rect.width, rect.height) * .62));
    const fx = document.createElement("div");
    fx.className = "cut-slash-fx";
    fx.style.left = `${Math.max(42, Math.min(rect.width - 42, centerX))}px`;
    fx.style.top = `${Math.max(42, Math.min(rect.height - 42, centerY))}px`;
    fx.style.setProperty("--slash-angle", `${angle}deg`);
    fx.style.setProperty("--slash-length", `${length}px`);
    fx.innerHTML = `
        <span class="cut-slash-glow"></span>
        <span class="cut-slash-line"></span>
        <span class="cut-slash-blade"></span>
        ${[...Array(6)].map((_, index)=>{
            const offset = (index - 2.5) * 24;
            const side = index % 2 === 0 ? -1 : 1;
            return `<i style="--spark-x:${offset}px;--spark-y:${side * (5 + index)}px;--spark-dx:${side * (12 + index * 2)}px;--spark-dy:${-18 - index * 2}px;--spark-delay:${40 + index * 28}ms"></i>`;
        }).join("")}
    `;
    stage.appendChild(fx);
    setTimeout(()=>fx.remove(), 760);
}
function playShapeLaserStrike(trace, step){
    const stage = document.getElementById("lens-stage");
    const points = trace?.line?.getAttribute("points");
    if(!stage || !points) return;
    stage.querySelectorAll(".shape-laser-layer").forEach(el=>el.remove());
    const rect = stage.getBoundingClientRect();
    const parsed = points.trim().split(/\s+/).map(pair=>{
        const [x, y] = pair.split(",").map(Number);
        return { x, y };
    }).filter(point=>Number.isFinite(point.x) && Number.isFinite(point.y));
    if(parsed.length < 2) return;
    const minX = Math.min(...parsed.map(point=>point.x));
    const maxX = Math.max(...parsed.map(point=>point.x));
    const minY = Math.min(...parsed.map(point=>point.y));
    const maxY = Math.max(...parsed.map(point=>point.y));
    const traceCenterX = (minX + maxX) / 2;
    const traceCenterY = (minY + maxY) / 2;
    const gemCore = document.getElementById("gem-core");
    const gemRect = gemCore?.getBoundingClientRect();
    const originX = gemRect ? gemRect.left + gemRect.width / 2 - rect.left : rect.width / 2;
    const originY = gemRect ? gemRect.top + gemRect.height / 2 - rect.top : rect.height / 2;
    const shiftX = originX - traceCenterX;
    const shiftY = originY - traceCenterY;
    const shiftedPoints = parsed.map(point=>`${(point.x + shiftX).toFixed(1)},${(point.y + shiftY).toFixed(1)}`).join(" ");
    const layer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    layer.classList.add("shape-laser-layer");
    layer.setAttribute("viewBox", `0 0 ${Math.max(1, rect.width).toFixed(0)} ${Math.max(1, rect.height).toFixed(0)}`);
    layer.style.transformOrigin = `${originX}px ${originY}px`;
    ["shape-laser-shadow", "shape-laser-line", "shape-laser-core"].forEach(className=>{
        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        line.classList.add(className);
        line.setAttribute("points", shiftedPoints);
        layer.appendChild(line);
    });
    stage.appendChild(layer);
    setTimeout(()=>layer.remove(), 780);
}
function finishDefectDrag(e){
    const drag = state.defectDrag;
    const step = currentStep();
    if(!drag || !step || drag.pointerId !== e.pointerId) return;
    state.defectDrag = null;
    state.suppressNextClick = true;
    if(drag.type === "clean") clearCleanToolFx();
    if(drag.type === "shape") clearShapeToolFx();
    if(drag.type === "light") clearLightToolFx();
    if(step.type === "cut"){
        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        const diff = angleDiff(angle, step.cutAngle || 0);
        if(drag.distance >= 80 && diff <= 24){
            playCutSwipeFx(step, drag, e.clientX, e.clientY);
            completeCutSwipe(step);
        }
        else toast("切除角度不对，要顺着长条方向拖拽。");
        return;
    }
    if(step.type === "light"){
        toast(`反光锁定 ${Math.min(100, Math.round((step.lightHold || 0) / LIGHT_SEARCH_REQUIRED_MS * 100))}%`);
        return;
    }
    if(step.type === "shape"){
        if(traceMatchesShape(drag.points, step.shapeTarget)){
            playShapeLaserStrike(drag.shapeTrace, step);
            fadeShapeTrace(drag.shapeTrace);
            step.shapeLaserPending = true;
            setTimeout(()=>{
                if(currentStep()?.id === step.id && !step.done){
                    step.shapeLaserPending = false;
                    completeCurrentStep(step);
                }
            }, 420);
        } else {
            fadeShapeTrace(drag.shapeTrace);
            toast(`描边不完整，再顺着${SHAPE_LABELS[step.shapeTarget]}轮廓拖一遍。`);
        }
    }
}
function beginShapeTrace(x, y){
    const layer = document.getElementById("shape-trace-layer");
    const stage = document.getElementById("lens-stage");
    if(!layer || !stage) return null;
    layer.classList.remove("fading");
    layer.innerHTML = "";
    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.classList.add("shape-trace-line");
    layer.appendChild(line);
    const trace = { layer, line, points:[] };
    updateShapeTrace(trace, x, y);
    return trace;
}
function updateShapeTrace(trace, x, y){
    if(!trace?.line) return;
    const rect = trace.layer.getBoundingClientRect();
    trace.points.push(`${(x - rect.left).toFixed(1)},${(y - rect.top).toFixed(1)}`);
    trace.line.setAttribute("points", trace.points.join(" "));
}
function fadeShapeTrace(trace){
    const layer = trace?.layer || document.getElementById("shape-trace-layer");
    if(!layer || !layer.childElementCount) return;
    layer.classList.add("fading");
    setTimeout(()=>{
        layer.innerHTML = "";
        layer.classList.remove("fading");
    }, 520);
}
function angleDiff(a, b){
    let diff = Math.abs((((a - b) % 180) + 180) % 180);
    return diff > 90 ? 180 - diff : diff;
}
function traceMatchesShape(points, shape){
    if(points.length < 4) return false;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, distance = 0;
    points.forEach((point, index)=>{
        minX = Math.min(minX, point.x);
        minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x);
        maxY = Math.max(maxY, point.y);
        if(index > 0) distance += Math.hypot(point.x - points[index - 1].x, point.y - points[index - 1].y);
    });
    const width = maxX - minX;
    const height = maxY - minY;
    const aspect = width / Math.max(1, height);
    if(width < 24 || height < 24) return false;
    if(shape === "circle") return distance >= 220 && aspect > .62 && aspect < 1.55;
    if(shape === "triangle") return distance >= 170 && width > 28 && height > 24;
    return distance >= 210 && aspect > .72 && aspect < 1.35;
}
function completeActiveGem(){
    const active = state.active;
    const gem = gemById(active.gemId);
    clearHotspot();
    state.playedTypes.add(active.gemId);
    state.knownTypes.add(active.gemId);
    const amount = releaseTypeToPlate(active.gemId, "核心玩法完成后同类型出石");
    addLog(`${gem.name} 鉴定完成，同类型 ${amount} 颗一起出石到盘子。`);
    state.active = null;
    state.hotspotRevealKey = null;
    state.lensLockedUntil = 0;
    renderMain();
    if(active.meta.continueBatch){
        const nextId = firstUnseenOrFirstBagId();
        if(nextId){
            setTimeout(()=>startCorePlay(nextId, { source:"batch", continueBatch:true }), 450);
            return;
        }
        state.pendingBatch = false;
        finishRound("整袋素体处理完成。");
        return;
    }
    finishRound("完成一次核心玩法。");
}
function finishRound(message){
    document.body.classList.remove("playing");
    document.getElementById("lens-stage").classList.add("idle");
    clearHotspot();
    addLog(message);
    renderMain();
    showScreen("screen-main");
}
function renderRewards(){
    const list = document.getElementById("reward-list");
    list.innerHTML = "";
    if(!state.rewards.length){
        list.innerHTML = `<div class="empty-state">没有待收集奖励</div>`;
        return;
    }
    const merged = new Map();
    state.rewards.forEach(reward=>{
        const prev = merged.get(reward.id) || 0;
        merged.set(reward.id, prev + reward.amount);
    });
    merged.forEach((amount, id)=>{
        const gem = gemById(id);
        const shape = rewardShapeForGem(gem);
        const image = plateGemImageValue(gem, shape);
        const item = document.createElement("div");
        item.className = "reward-item";
        item.setAttribute("aria-label", `${gem.name} ×${amount}`);
        item.innerHTML = `<div class="reward-gem-image"></div><b class="reward-amount">×${amount}</b><span class="reward-name">${gem.name}</span>`;
        const imageEl = item.querySelector(".reward-gem-image");
        if(image) imageEl.style.backgroundImage = image;
        else imageEl.style.background = gem.color;
        list.appendChild(item);
    });
}
function openRewardModal(){
    if(!state.rewards.length){
        toast("没有待收集奖励");
        return;
    }
    renderRewards();
    document.getElementById("reward-modal").classList.add("show");
}
function closeRewardModal(){
    document.getElementById("reward-modal").classList.remove("show");
}
function collectRewards(){
    if(!state.rewards.length){
        toast("没有待收集奖励");
        closeRewardModal();
        return;
    }
    addLog(`收集 ${state.rewards.length} 组奖励。`);
    state.rewards = [];
    state.plate = {};
    state.plateItems = [];
    document.body.classList.remove("playing");
    document.getElementById("lens-stage").classList.add("idle");
    closeRewardModal();
    renderMain();
    showScreen("screen-main");
}
function handleRewardRightClick(e){
    if(e.target.closest("select,input,textarea")) return;
    const modal = document.getElementById("reward-modal");
    const modalOpen = modal.classList.contains("show");
    if(!modalOpen && !state.rewards.length) return;
    e.preventDefault();
    if(modalOpen) collectRewards();
    else openRewardModal();
}
function setupRewardListScroll(){
    const list = document.getElementById("reward-list");
    if(!list) return;
    let dragging = false;
    let startX = 0;
    let startScroll = 0;
    list.addEventListener("wheel", e=>{
        if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        e.preventDefault();
        list.scrollLeft += e.deltaY;
    }, { passive:false });
    list.addEventListener("pointerdown", e=>{
        if(e.button !== 0) return;
        dragging = true;
        startX = e.clientX;
        startScroll = list.scrollLeft;
        list.classList.add("dragging");
        list.setPointerCapture(e.pointerId);
    });
    list.addEventListener("pointermove", e=>{
        if(!dragging) return;
        list.scrollLeft = startScroll - (e.clientX - startX);
    });
    const stopDrag = e=>{
        if(!dragging) return;
        dragging = false;
        list.classList.remove("dragging");
        if(list.hasPointerCapture(e.pointerId)) list.releasePointerCapture(e.pointerId);
    };
    list.addEventListener("pointerup", stopDrag);
    list.addEventListener("pointercancel", stopDrag);
}
function exitPlay(){
    if(state.active){
        addLog(`${gemById(state.active.gemId).name} 玩法退出，未完成的同类型素体留在袋中。`);
    }
    state.active = null;
    state.pendingBatch = false;
    state.hotspotRevealKey = null;
    state.lensLockedUntil = 0;
    document.body.classList.remove("playing");
    document.getElementById("lens-stage").classList.add("idle");
    clearHotspot();
    renderMain();
    showScreen("screen-main");
}
function applyDataPack(key){
    state.dataPackKey = DEMO_DATA_PACKS[key] ? key : "fullCoverage";
    resetDemo();
}
function resetDemo(){
    const pack = currentDataPack();
    state.bag = normalizedBag(pack.bag);
    state.knownTypes = new Set(pack.known);
    state.playedTypes = new Set();
    state.plate = {};
    state.plateItems = [];
    state.rewards = [];
    state.active = null;
    state.pendingBatch = false;
    state.hotspotRevealKey = null;
    state.lensLockedUntil = 0;
    document.body.classList.remove("playing");
    document.getElementById("reward-modal").classList.remove("show");
    document.getElementById("lens-stage").classList.add("idle");
    const mainLog = document.getElementById("main-log");
    if(mainLog) mainLog.innerHTML = "";
    clearHotspot();
    addLog(`已切换/重置为「${pack.label}」：${pack.note}`);
    renderMain();
    showScreen("screen-main");
}
function setupDragDrop(){
    const bag = document.getElementById("bag");
    bag.addEventListener("dragstart", e=>{
        state.dragPayload = { type:"bag" };
        e.dataTransfer.setData("text/plain", JSON.stringify(state.dragPayload));
    });
    const bindDrop = (el, onDrop)=>{
        el.addEventListener("dragover", e=>{
            e.preventDefault();
            el.classList.add("over");
        });
        el.addEventListener("dragleave", ()=>el.classList.remove("over"));
        el.addEventListener("drop", e=>{
            e.preventDefault();
            el.classList.remove("over");
            let payload = state.dragPayload;
            try{
                payload = JSON.parse(e.dataTransfer.getData("text/plain")) || payload;
            }catch(err){}
            onDrop(payload);
            state.dragPayload = null;
        });
    };
    bindDrop(document.getElementById("lens-stage"), payload=>{
        if(!payload) return;
        if(payload.type === "bag") startBatchFromBag();
        if(payload.type === "known") startKnownStone(payload.id);
    });
    bindDrop(document.getElementById("batch-drop"), payload=>{
        if(payload && payload.type === "bag") startBatchFromBag();
        else if(payload && payload.type === "known") completeKnownStoneInBatch(payload.id);
        else toast("批量入口只接受整袋处理或左侧素体");
    });
}
function setupCoreMouseControls(){
    const playScreen = document.getElementById("screen-main");
    playScreen.addEventListener("wheel", e=>{
        if(!state.active) return;
        e.preventDefault();
        cycleLensByWheel(e.deltaY);
    }, { passive:false });
    playScreen.addEventListener("contextmenu", e=>{
        if(state.active) e.preventDefault();
    });
    document.addEventListener("contextmenu", handleRewardRightClick);
}
document.addEventListener("DOMContentLoaded", ()=>{
    warmupImageCache();
    setupDragDrop();
    setupCoreMouseControls();
    setupLogPanel();
    setupSortControls();
    setupRewardListScroll();
    const hotspot = document.getElementById("hotspot");
    hotspot.addEventListener("click", handleHotspotClick);
    hotspot.addEventListener("pointerdown", startDefectDrag);
    hotspot.addEventListener("pointermove", updateDefectDrag);
    hotspot.addEventListener("pointerup", finishDefectDrag);
    hotspot.addEventListener("pointercancel", finishDefectDrag);
    document.getElementById("exit-play-btn").addEventListener("click", exitPlay);
    document.getElementById("finish-fast-btn").addEventListener("click", ()=>{
        if(!state.active) return;
        while(state.active && currentStep()){
            const step = currentStep();
            state.lensIndex = step.lens;
            state.activeTool = step.type;
            tryCoreInteraction();
        }
    });
    document.getElementById("reward-back-btn").addEventListener("click", collectRewards);
    document.getElementById("reward-modal").addEventListener("click", e=>{
        if(e.target.id === "reward-modal") collectRewards();
    });
    document.addEventListener("keydown", e=>{
        if(e.key === "Escape" && document.getElementById("reward-modal").classList.contains("show")) collectRewards();
    });
    document.getElementById("collect-btn").addEventListener("click", openRewardModal);
    document.getElementById("organize-plate-btn").addEventListener("click", organizePlate);
    document.getElementById("layout-select").addEventListener("change", e=>applyLayoutMode(e.target.value));
    document.getElementById("data-pack-select").addEventListener("change", e=>applyDataPack(e.target.value));
    document.getElementById("reset-demo-btn").addEventListener("click", resetDemo);
    addLog("主 UI 已就绪：从左侧拖拽素体到镜片位置。");
    renderDataPackOptions();
    applyLayoutMode(state.layoutMode);
    renderMain();
});
